# ==============================================================================
# NutriAdvisor LLM Proxy — Configuration
# ==============================================================================

server:
  listen: ":3001"

auth:
  free_tier_daily_limit: 3   # бесплатных запросов в день

# ---------------------------------------------------------------------------
# Провайдеры LLM
# ---------------------------------------------------------------------------
providers:
  - name: llama-local
    type: llamacpp
    base_url: "http://localhost:8080"
    max_concurrency: 1        # threads=1 → запросы в очередь
    priority: 10              # низкий приоритет (запасной)
    timeout: 600s
    models:
      - name: "gemma-4"
        alias: "gemma-4"
        priority: 3             # после бесплатных, но до платных
        input_price: 0.0      # бесплатно (свой сервер)
        output_price: 0.0
        max_tokens: 8192

  - name: openrouter
    type: openai_compatible
    base_url: "https://openrouter.ai/api"
    api_key: "${OPENROUTER_API_KEY}"
    max_concurrency: 2
    priority: 5
    timeout: 120s
    proxy_required: true
    models:
      # --- gemma-4 alias (все варианты одной модели) ---
      # Порядок: бесплатные сначала, потом локальный, потом платные
      - name: "google/gemma-4-31b-it:free"
        alias: "gemma-4"
        priority: 1             # самый высокий — бесплатная 31b
        input_price: 0.0
        output_price: 0.0
        max_tokens: 8192

      - name: "google/gemma-4-26b-a4b-it:free"
        alias: "gemma-4"
        priority: 2             # второй — бесплатная 26b
        input_price: 0.0
        output_price: 0.0
        max_tokens: 8192

      - name: "google/gemma-4-26b-a4b-it"
        alias: "gemma-4"
        priority: 4             # четвёртый — платная 26b
        input_price: 6.75
        output_price: 27.0
        max_tokens: 8192

      - name: "google/gemma-4-31b-it"
        alias: "gemma-4"
        priority: 5             # пятый — платная 31b
        input_price: 6.75
        output_price: 27.0
        max_tokens: 8192

      # --- отдельный алиас для flash-preview ---
      - name: "google/gemini-2.5-flash"
        alias: "gemini-2.5-fp"
        priority: 1
        input_price: 6.75
        output_price: 27.0
        max_tokens: 8192
      
      # --- отдельный алиас для glm-5.2 ---
      - name: "z-ai/glm-5.2:free"
        alias: "glm-5.2-free"
        priority: 1
        input_price: 0.0
        output_price: 0.0
        max_tokens: 8192


  - name: gigachat
    type: gigachat
    base_url: "https://gigachat.devices.sberbank.ru/api/v1"
    api_key: "${GIGACHAT_API_KEY}"
    max_concurrency: 2
    priority: 10
    timeout: 120s
    proxy_required: false
    models:
      - name: "GigaChat-Plus"
        alias: "gigachat"
        priority: 1
        input_price: 50.0
        output_price: 150.0
        max_tokens: 8192

# ---------------------------------------------------------------------------
# Алиасы моделей (маршрутизация)
# ---------------------------------------------------------------------------
model_aliases:
  - name: gemma-4
    fallback_chain: [openrouter, llama-local]   # free → local → paid
    strategy: priority
  - name: glm-5.2-free
    fallback_chain: [openrouter]
    strategy: priority
  - name: gemini-2.5-fp
    fallback_chain: [openrouter]
    strategy: priority
  - name: gigachat
    fallback_chain: [gigachat]
    strategy: priority

# ---------------------------------------------------------------------------
# Внешние SOCKS5-прокси (SSH-туннели через vpnjantit)
# ---------------------------------------------------------------------------
# Пароль авто-вычисляется: часть логина до первого дефиса (user-pass → user)
# Каждый прокси поднимается на своём локальном порту (socks5_addr)
# health_check_interval: TCP-проверка каждые N секунд
# При падении туннеля — автоперезапуск (auto_restart: true)
# ---------------------------------------------------------------------------
external_proxies:
  - id: proxy-az1
    enabled: false
    socks5_addr: "127.0.0.1:10801"
    ssh_login: "az1lellkkr1-vpnjantit.com@az1.vpnjantit.com"
    ssh_port: 22
    auto_restart: true
    health_check_interval: 180s
    restart_delay: 30s
    tags: ["general"]

  - id: proxy-az2
    enabled: true
    socks5_addr: "127.0.0.1:10802"
    ssh_login: "az1krksdsew1-vpnjantit.com@az1.vpnjantit.com"
    ssh_port: 22
    auto_restart: true
    health_check_interval: 180s
    restart_delay: 30s
    tags: ["general"]

  - id: proxy-usa5
    enabled: false
    socks5_addr: "127.0.0.1:10803"
    ssh_login: "usa5sdfkel5-vpnjantit.com@usa5.vpnjantit.com"
    ssh_port: 22
    auto_restart: true
    health_check_interval: 180s
    restart_delay: 30s
    tags: ["usa"]

# ---------------------------------------------------------------------------
# Биллинг
# ---------------------------------------------------------------------------
billing:
  db_path: "./data/billing.db"
  min_balance_to_serve: 0     # минимальный баланс в копейках (0 = всегда)
  cm_server_url: "http://127.0.0.1:8002/cm"
  cm_app: "nuadvi"

# ---------------------------------------------------------------------------
# Логирование
# ---------------------------------------------------------------------------
logging:
  level: "info"               # debug | info | warn
  format: "text"              # text | json
